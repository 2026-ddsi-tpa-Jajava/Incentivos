$kind: http-request
name: Crear Mision
url: "{{baseUrl}}/misiones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": null,
      "nombre": "{{mision_nombre}}",
      "insigniaID": "{{insigniaId}}",
      "categoriaInicio": "{{mision_cat_inicio}}",
      "categoriaFin": "{{mision_cat_fin}}",
      "tipo": "{{mision_tipo}}"
    }
scripts:
  - type: afterResponse
    code: "let pasoActual = parseInt(pm.globals.get(\"pasoActual\")) || 0;\r

      pm.globals.set(\"pasoActual\", pasoActual + 1);\r

      console.log(\"Misión creada con éxito. Siguiente paso configurado: \" + (pasoActual + 1));"
    language: text/javascript
order: 10000
