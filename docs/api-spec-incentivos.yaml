openapi: 3.0.0
info:
  title: Incentivos API
  description: "API para la gestión de insignias, misiones, asignaciones y procesamiento de donadores en el componente de Incentivos del TP de DDSI."
  version: 1.0.0
servers:
  - url: /
paths:
  /insignias:
    get:
      summary: Listar todas las insignias
      operationId: listarInsignias
      responses:
        "200":
          description: Lista de insignias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InsigniaResponse"
    post:
      summary: Crear una nueva insignia
      operationId: crearInsignia
      requestBody:
        description: Datos para crear una insignia
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsigniaRequest"
        required: true
      responses:
        "201":
          description: Insignia creada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsigniaResponse"
        "400":
          description: Solicitud inválida (datos incorrectos o incompletos)

  /insignias/{parametro}:
    get:
      summary: Obtener una insignia por ID o las insignias de un donador
      operationId: buscarInsignia
      parameters:
        - name: parametro
          in: path
          description: ID de la insignia (ej. ins-1, ins-2, etc.)
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Insignia encontrada
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InsigniaResponse"
                  - type: array
                    items:
                      $ref: "#/components/schemas/InsigniaResponse"
        "404":
          description: Insignia no encontrada

    post:
      summary: Asignar una insignia a un donador
      operationId: asignarInsigniaADonador
      parameters:
        - name: parametro
          in: path
          description: ID del donador
          required: true
          schema:
            type: string
      requestBody:
        description: Datos de asignación de insignia
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsigniaAsignacion"
        required: true
      responses:
        "204":
          description: Insignia asignada correctamente al donador
        "400":
          description: Solicitud inválida (datos incorrectos o incompletos)
        "404":
          description: Donador o insignia no encontrado

  /misiones:
    get:
      summary: Listar todas las misiones
      operationId: listarMisiones
      responses:
        "200":
          description: Lista de misiones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MisionResponse"
    post:
      summary: Crear una nueva misión
      operationId: crearMision
      requestBody:
        description: Datos para crear una misión
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MisionRequest"
        required: true
      responses:
        "201":
          description: Misión creada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MisionResponse"
        "400":
          description: Solicitud inválida (datos incorrectos o incompletos)

  /misiones/{parametro}:
    get:
      summary: Obtener una misión por ID o la misión en curso de un donador
      operationId: buscarMision
      parameters:
        - name: parametro
          in: path
          description: ID de la misión (ej. mis-1, mis-2, etc.)
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Misión encontrada
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MisionResponse"
                  - type: array
                    items:
                      $ref: "#/components/schemas/MisionResponse"
        "404":
          description: Misión no encontrada

    post:
      summary: Asignar una misión a un donador
      operationId: asignarMisionADonador
      parameters:
        - name: parametro
          in: path
          description: ID del donador
          required: true
          schema:
            type: string
      requestBody:
        description: Datos de asignación de misión
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MisionAsignacion"
        required: true
      responses:
        "204":
          description: Misión asignada correctamente al donador
        "400":
          description: Solicitud inválida (datos incorrectos o incompletos)
        "404":
          description: Donador o misión no encontrado

  /procesamiento/{donadorID}:
    post:
      summary: Procesar acciones relacionadas con un donador
      operationId: procesarDonador
      parameters:
        - name: donadorID
          in: path
          description: ID del donador a procesar
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Procesamiento completado exitosamente
        "404":
          description: Donador no encontrado
        "400":
          description: Procesamiento incorrecto

  /donadores/{donadorID}/estado:
    get:
      summary: Obtener el estado local de un donador
      operationId: obtenerEstadoDonador
      parameters:
        - name: donadorID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Categoría, misión, insignias e historial del donador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoDonadorResponse"
        "404":
          description: Donador no encontrado

  /reset:
    delete:
      summary: Limpiar y recargar los datos base
      operationId: limpiarTodo
      responses:
        "204":
          description: Datos limpiados y datos base recreados

components:
  schemas:
    InsigniaRequest:
      required:
        - nombre
        - descripcion
      type: object
      properties:
        nombre:
          type: string
          description: Nombre de la insignia
          example: Primer Donación
        descripcion:
          type: string
          description: Descripción de la insignia
          example: Otorgada al realizar la primera donación
      description: Datos para crear una insignia

    InsigniaResponse:
      type: object
      properties:
        id:
          type: string
          description: Identificador único de la insignia
          example: ins-1
        nombre:
          type: string
          description: Nombre de la insignia
          example: Primer Donación
        descripcion:
          type: string
          description: Descripción de la insignia
          example: Otorgada al realizar la primera donación
      description: Representación de una insignia

    MisionRequest:
      required:
        - nombre
        - insigniaID
        - categoriaInicio
        - categoriaFin
      type: object
      properties:
        nombre:
          type: string
          description: Nombre de la misión
          example: Completitud
        insigniaID:
          type: string
          description: ID de la insignia asociada a la misión
          example: ins-1
        categoriaInicio:
          type: string
          enum: [OCASIONAL, COLABORADOR, TRANSFORMADOR, SALVADOR, REVOLUCIONARIO]
          description: Categoría inicial de donador para esta misión
          example: OCASIONAL
        categoriaFin:
          type: string
          enum: [OCASIONAL, COLABORADOR, TRANSFORMADOR, SALVADOR, REVOLUCIONARIO]
          description: Categoría final tras completar la misión
          example: COLABORADOR
        tipo:
          type: string
          enum: [COMPLETITUD, DONACIONES_EXITOSAS, DONACIONES_ASCENDENTES, REVOLUCION_DONADORA]
          description: Tipo de misión
          example: COMPLETITUD
      description: Datos para crear una misión

    MisionResponse:
      type: object
      properties:
        id:
          type: string
          description: Identificador único de la misión
          example: mis-1
        nombre:
          type: string
          description: Nombre de la misión
          example: Completitud
        insigniaID:
          type: string
          description: ID de la insignia asociada
          example: ins-1
        categoriaInicio:
          type: string
          enum: [OCASIONAL, COLABORADOR, TRANSFORMADOR, SALVADOR, REVOLUCIONARIO]
          description: Categoría inicial requerida
          example: OCASIONAL
        categoriaFin:
          type: string
          enum: [OCASIONAL, COLABORADOR, TRANSFORMADOR, SALVADOR, REVOLUCIONARIO]
          description: Categoría final tras completar
          example: COLABORADOR
        tipo:
          type: string
          enum: [COMPLETITUD, DONACIONES_EXITOSAS, DONACIONES_ASCENDENTES, REVOLUCION_DONADORA]
          description: Tipo de misión
          example: COMPLETITUD
      description: Representación de una misión

    InsigniaAsignacion:
      required:
        - insigniaID
      type: object
      properties:
        insigniaID:
          type: string
          description: ID de la insignia a asignar
          example: ins-1
      description: Datos para asignar una insignia a un donador

    MisionAsignacion:
      required:
        - misionID
      type: object
      properties:
        misionID:
          type: string
          description: ID de la misión a asignar
          example: mis-1
      description: Datos para asignar una misión a un donador

    EstadoDonadorResponse:
      type: object
      required:
        - donadorID
        - categoria
        - insignias
        - historialCategorias
      properties:
        donadorID:
          type: string
          example: don-1
        categoria:
          type: string
          enum: [OCASIONAL, COLABORADOR, TRANSFORMADOR, SALVADOR, REVOLUCIONARIO]
        misionActualID:
          type: string
          nullable: true
          example: mis-completitud
        insignias:
          type: array
          items:
            type: string
        historialCategorias:
          type: array
          items:
            type: object
            properties:
              anterior:
                type: string
                nullable: true
              nueva:
                type: string
              fechaHora:
                type: string
                format: date-time
              motivo:
                type: string
